<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Debt-Free">
<meta name="theme-color" content="#6d4aff">
<link rel="icon" type="image/png" href="/icon.png?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Route to Debt-Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f3f9; --card:#ffffff; --card-2:#fafaff; --ink:#15151f; --muted:#70708a;
  --line:#ececf4; --accent:#6d4aff; --accent-soft:#f0ecff; --accent-ink:#5533e0;
  --ok:#0fae68; --ok-soft:#e6f8f0; --bad:#ef4b3f; --bad-soft:#feecea;
  --warn:#f79009; --warn-soft:#fff4e5;
  --shadow:0 1px 2px rgba(20,20,40,.04), 0 8px 24px rgba(20,20,40,.06);
  --shadow-lg:0 12px 40px rgba(60,40,160,.18);
  --r:18px; --r-sm:12px;
  --g1:#6d4aff; --g2:#ffa53b; --g3:#2ec5ce; --g4:#ff6fa5;
  --g5:#f0554b; --g6:#34c77b; --g7:#3b82f6; --g8:#9aa0b4;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f0f14; --card:#1a1a22; --card-2:#20202a; --ink:#f2f2f7; --muted:#9494ab;
  --line:#2b2b36; --accent:#8b6dff; --accent-soft:#251f45; --accent-ink:#b8a4ff;
  --ok:#3ad18c; --ok-soft:#14301f; --bad:#ff6a5e; --bad-soft:#331815;
  --warn:#f5b342; --warn-soft:#332413;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0f0f14; --card:#1a1a22; --card-2:#20202a; --ink:#f2f2f7; --muted:#9494ab;
  --line:#2b2b36; --accent:#8b6dff; --accent-soft:#251f45; --accent-ink:#b8a4ff;
  --ok:#3ad18c; --ok-soft:#14301f; --bad:#ff6a5e; --bad-soft:#331815;
  --warn:#f5b342; --warn-soft:#332413;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{overflow-x:clip}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
.mono{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:232px;flex:0 0 232px;background:var(--card);border-right:1px solid var(--line);
  padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.brand-badge{
  width:34px;height:34px;border-radius:11px;flex:0 0 34px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#b06dff);color:#fff;font-size:17px;object-fit:cover;
}
.brand b{font-size:15.5px;letter-spacing:-.03em;display:block;line-height:1.15}
.brand span{font-size:11px;color:var(--muted);font-weight:500}
.nav-btn{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;border:0;
  background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;cursor:pointer;width:100%;text-align:left;
  transition:background .15s,color .15s;
}
.nav-btn:hover{background:var(--card-2);color:var(--ink)}
.nav-btn.on{background:var(--ink);color:var(--bg)}
:root[data-theme="dark"] .nav-btn.on,
:root:not([data-theme="light"]) .nav-btn.on{background:var(--accent);color:#fff}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .nav-btn.on{background:var(--ink);color:#fff}}
.nav-btn svg{width:17px;height:17px;flex:0 0 17px}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line)}

.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.hello h1{font-size:23px}
.hello p{margin:3px 0 0;color:var(--muted);font-size:13px}
.ctrl-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.sel,.btn{
  border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 13px;
  font-weight:600;font-size:13px;cursor:pointer;transition:border-color .15s,background .15s,transform .08s;
}
.sel{padding-right:30px;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2370708a' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center;background-size:15px}
.btn:hover,.sel:hover{border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.muted{color:var(--muted)}
.hide{display:none !important}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.kpi .k-val{font-size:24px;font-weight:800;letter-spacing:-.035em;margin-top:7px}
.kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:500}
.kpi.hero{background:linear-gradient(145deg,#2c2150,#171226 55%,#241a44);border:0;color:#fff;box-shadow:var(--shadow-lg)}
.kpi.hero .k-label,.kpi.hero .k-sub{color:rgba(255,255,255,.62)}

/* ---------- grid ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sec-head h3{font-size:14.5px}
.sec-head .muted{font-size:12px;font-weight:500}

/* ---------- donut ---------- */
.donut-wrap{display:flex;align-items:center;gap:18px;padding:18px;flex-wrap:wrap}
.donut{position:relative;flex:0 0 152px;width:152px;height:152px}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .mid b{font-size:16.5px;font-weight:800;letter-spacing:-.03em;display:block}
.donut .mid span{font-size:10.5px;color:var(--muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:140px;align-content:flex-start}
.legend .pill{background:var(--card-2);border:1px solid var(--line)}

/* ---------- table ---------- */
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;padding:10px 14px;background:var(--card-2);border-bottom:1px solid var(--line);white-space:nowrap
}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat{font-weight:700}
.rm{font-size:11.5px;color:var(--muted);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);white-space:nowrap}
.state{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;border:0;cursor:pointer}
.state.yes{background:var(--ok-soft);color:var(--ok)}
.state.no{background:var(--card-2);color:var(--muted)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.icon-btn:hover{background:var(--card-2);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}

/* ---------- bars ---------- */
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s ease}
.inst{padding:15px 18px;border-bottom:1px solid var(--line)}
.inst:last-child{border-bottom:0}
.inst-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:9px;flex-wrap:wrap}
.split{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px;font-weight:600}

/* ---------- forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.inp{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card-2);
  font-size:14px;outline:0;transition:border-color .15s
}
.inp:focus{border-color:var(--accent);background:var(--card)}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2370708a' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;background-size:16px;padding-right:34px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(14,12,26,.55);backdrop-filter:blur(3px);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:22px;width:100%;max-width:440px;box-shadow:var(--shadow-lg);max-height:92vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px}
.modal-head h3{font-size:16px}
.modal-body{padding:14px 20px 20px}
.modal-foot{display:flex;gap:9px;padding-top:6px}
.modal-foot .btn{flex:1;justify-content:center;text-align:center}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:99;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;
  transition:opacity .25s, bottom .25s;pointer-events:none
}
.toast.on{opacity:1;bottom:100px}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}

/* ---------- trend chart ---------- */
.tr-chart{display:flex;align-items:flex-end;gap:10px;height:150px}
.tr-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.tr-bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.tr-bars i{display:block;width:min(16px,40%);min-height:2px;border-radius:5px 5px 2px 2px;transition:height .45s cubic-bezier(.22,.61,.36,1)}
.tr-col span{font-size:11.5px;font-weight:700;color:var(--muted)}
.tr-col span.on{color:var(--ink)}

/* ---------- sync paused banner ---------- */
#syncBanner:empty{display:none}
.sync-warn{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:16px;display:flex;gap:11px;align-items:flex-start}
.sync-warn svg{width:19px;height:19px;flex:0 0 19px;color:var(--warn);margin-top:1px}
.sync-warn b{display:block;font-size:13.5px}
.sync-warn p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.sync-warn .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ---------- tick control ---------- */
.tick{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:4px 11px 4px 4px;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--muted);
  white-space:nowrap;transition:background .15s,border-color .15s,color .15s
}
.tick i{
  width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex:0 0 19px;
  display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s
}
.tick i svg{width:11px;height:11px}
.tick:hover{border-color:var(--accent);color:var(--ink)}
.tick:hover i{border-color:var(--accent)}
.tick.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.tick.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.due-row{display:flex;align-items:center;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line)}
.due-row:last-child{border-bottom:0}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;
  box-shadow:0 0 0 1px var(--line) inset;transition:transform .12s,border-color .12s}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:var(--ink);box-shadow:none}
input[type="date"].inp,input[type="month"].inp{-webkit-appearance:none;appearance:none;display:block;
  width:100%;box-sizing:border-box;height:auto;min-height:42px;padding:10px 12px;font-size:14px;
  line-height:1.25;text-align:left;overflow:hidden}
input[type="date"].inp::-webkit-date-and-time-value,input[type="month"].inp::-webkit-date-and-time-value{
  text-align:left;margin:0;padding:0;line-height:1.25;min-height:0}
input[type="date"].inp::-webkit-datetime-edit,input[type="month"].inp::-webkit-datetime-edit{padding:0;line-height:1.25}
input[type="date"].inp::-webkit-calendar-picker-indicator,input[type="month"].inp::-webkit-calendar-picker-indicator{
  margin:0 0 0 auto;padding:0;opacity:.55}

/* ---------- motion ---------- */
.tick{transition:background .16s ease,border-color .16s ease,color .16s ease,transform .1s ease}
.tick:active{transform:scale(.95)}
.tick i{transition:background .16s ease,border-color .16s ease}
.tick i svg{transition:opacity .16s ease,transform .18s cubic-bezier(.34,1.56,.64,1)}
.tick.on i svg{transform:scale(1)}
.tick i svg{transform:scale(.4)}
.tick.pop i{animation:pop .26s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.bump{animation:bump .3s ease}
@keyframes bump{0%{opacity:.35}100%{opacity:1}}
.bar i{transition:width .45s cubic-bezier(.22,.61,.36,1)}
.state{transition:background .16s ease,color .16s ease}
.sk{width:100%;height:100%;border-radius:var(--r);
  background:linear-gradient(100deg,var(--card) 30%,var(--card-2) 50%,var(--card) 70%);
  background-size:220% 100%;animation:sheen 1.25s linear infinite}
@keyframes sheen{0%{background-position:120% 0}100%{background-position:-120% 0}}
@media (prefers-reduced-motion: reduce){
  .tick,.tick i,.tick i svg,.bar i,.state{transition:none}
  .tick.pop i,.bump,.sk{animation:none}
}
.btn.icon-only{padding:8px;display:grid;place-items:center;line-height:0}
.btn.icon-only svg{width:16px;height:16px}
.btn.with-icon{display:inline-flex;align-items:center;gap:6px;line-height:1}
.btn.with-icon svg{width:15px;height:15px}
.empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:5px}

/* ---------- mobile ---------- */
.tabbar{display:none}
@media (max-width:860px){ .due-row{padding:11px 14px} }
@media (max-width:860px){
  .two{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .side{display:none}
  .main{padding:18px 14px calc(96px + env(safe-area-inset-bottom))}
  .topbar{align-items:stretch;flex-direction:column;gap:12px}
  .hello h1{font-size:20px}
  .kpi .k-val{font-size:20px}
  .ctrl-row .sel{flex:1}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
    border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));justify-content:space-around
  }
  .tab{
    border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:700;padding:5px 12px;border-radius:12px;cursor:pointer;flex:1
  }
  .tab svg{width:19px;height:19px}
  .tab.on{color:var(--accent);background:var(--accent-soft)}
  th,td{padding:10px 11px}
  .donut-wrap{justify-content:center}
}
@media (max-width:420px){ .kpis{grid-template-columns:1fr 1fr} }
/* iPhone/iPad Safari zooms in on any field under 16px and stays zoomed, so touch screens get 16px fields */
@media (hover:none) and (pointer:coarse){
  .inp,.sel,input[type="date"].inp,input[type="month"].inp{font-size:16px}
}
@supports (-webkit-touch-callout:none){
  .inp,.sel,input[type="date"].inp,input[type="month"].inp{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img class="brand-badge" src="/icon.png?v=2" alt="">
      <div><b>Route</b><span>to Debt-Free</span></div>
    </div>
    <nav id="navDesk"></nav>
    <div class="side-foot">
      <button class="nav-btn" id="themeBtn" style="font-size:12.5px">🌓 Light / dark</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="hello">
        <h1 id="greet">Hello</h1>
        <p id="subgreet">Loading your plan</p>
      </div>
      <div class="ctrl-row">
        <select class="sel" id="monthSel"></select>
        <span class="pill" id="syncChip" style="display:none;border:1px solid var(--line);background:var(--card)"></span>
        <button class="btn sm icon-only" id="themeToggle" title="Theme"></button>
        <button class="btn sm with-icon" id="exportBtn" title="Export to Excel">Export</button>
        <button class="btn sm primary" id="newMonthBtn">+ New month</button>
      </div>
    </div>
    <div id="syncBanner"></div>
    <div id="view"></div>
  </main>
</div>

<nav class="tabbar" id="navMob"></nav>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<div id="modalHost"></div>
<div class="toast" id="toast"></div>
<script>
/* ============ constants ============ */
const DEFAULT_GROUPS = [
  {name:'Housing',   hex:'#6d4aff'},
  {name:'Family',    hex:'#ffa53b'},
  {name:'Transport', hex:'#2ec5ce'},
  {name:'Living',    hex:'#ff6fa5'},
  {name:'Debt',      hex:'#f0554b'},
  {name:'Insurance', hex:'#34c77b'},
  {name:'Savings',   hex:'#3b82f6', locked:true},
  {name:'Other',     hex:'#9aa0b4', locked:true}
];
const PALETTE = ['#6d4aff','#8b6dff','#3b82f6','#2ec5ce','#34c77b','#8bc34a',
                 '#ffa53b','#f5b342','#ff6fa5','#f0554b','#c86dd7','#9aa0b4'];
function groups(){
  const g = state.settings.groups;
  return (Array.isArray(g) && g.length) ? g : DEFAULT_GROUPS;
}
function groupHex(name){
  const g = groups().find(x => x.name === name);
  return g ? g.hex : '#9aa0b4';
}
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ICONS = {

/* ============ maths ============ */
function calc(m){
  if(!m) return null;
  const inc = (m.income||[]).reduce((a,l)=>a+num(l.amount),0);
  const incGot = (m.income||[]).filter(l=>l.received).reduce((a,l)=>a+num(l.amount),0);
  const lines = m.lines||[];
  const save = lines.filter(l=>l.group==='Savings');
  const spend = lines.filter(l=>l.group!=='Savings');
  const planSpend = spend.reduce((a,l)=>a+num(l.amount),0);
  const planSave  = save.reduce((a,l)=>a+num(l.amount),0);
  const actSpend  = spend.reduce((a,l)=>a+(l.paid?num(l.actual!==''&&l.actual!=null?l.actual:l.amount):0),0);
  const actSave   = save.reduce((a,l)=>a+(l.paid?num(l.actual!==''&&l.actual!=null?l.actual:l.amount):0),0);
  const unpaid    = lines.filter(l=>!l.paid).reduce((a,l)=>a+num(l.amount),0);
  const byGroup = {};
  spend.forEach(l=>{ byGroup[l.group||'Other'] = (byGroup[l.group||'Other']||0)+num(l.amount); });
  const insts = lines.filter(l=>num(l.termTotal)>0);
  const debtLeft = insts.reduce((a,l)=>a+num(l.amount)*Math.max(0,num(l.termTotal)-num(l.termCurrent)),0);
  return {
    inc, incGot, planSpend, planSave, actSpend, actSave, unpaid,
    allocated: planSpend+planSave,
    free: inc-(planSpend+planSave),
    cash: incGot - actSpend - actSave,
    byGroup, insts, debtLeft,
    paidCount: lines.filter(l=>l.paid).length,
    total: lines.length
  };
}
function payoffProjection(){
  const ids = sortedMonthIds();
  const base = state.monthId || ids[ids.length-1];
  const m = state.months[base];
  if(!m) return null;
  let maxLeft = 0, ends = [];
  (m.lines||[]).filter(l=>num(l.termTotal)>0).forEach(l=>{
    const left = Math.max(0, num(l.termTotal)-num(l.termCurrent));
    if(left>maxLeft) maxLeft = left;
    ends.push({name:l.category, left, id:shiftMonth(base, left)});
  });
  if(!ends.length) return null;
  return {freeMonth: shiftMonth(base, maxLeft), months: maxLeft, ends: ends.sort((a,b)=>a.left-b.left)};
}

/* ============ donut ============ */
function donut(data, totalLabel, totalVal){
  const entries = Object.entries(data).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const sum = entries.reduce((a,[,v])=>a+v,0);
  if(!sum) return '<div class="empty">Nothing to chart yet</div>';
  const R = 62, C = 2*Math.PI*R;
  let off = 0;
  const arcs = entries.map(([k,v])=>{
    const frac = v/sum, len = frac*C - (entries.length>1?3:0);
    const seg = `<circle cx="76" cy="76" r="${R}" fill="none" stroke="${groupHex(k)}" stroke-width="21"
      stroke-dasharray="${Math.max(len,0).toFixed(2)} ${(C-Math.max(len,0)).toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}" stroke-linecap="round" transform="rotate(-90 76 76)"/>`;
    off += frac*C;
    return seg;
  }).join('');
  const legend = entries.map(([k,v])=>`<span class="pill"><i class="dot" style="background:${groupHex(k)}"></i>${esc(k)} <b class="muted">${Math.round(v/sum*100)}%</b></span>`).join('');
  return `<div class="donut-wrap">
    <div class="donut"><svg viewBox="0 0 152 152" width="152" height="152">${arcs}</svg>
      <div class="mid"><div><b>${esc(totalVal)}</b><span>${esc(totalLabel)}</span></div></div>
    </div>
    <div class="legend">${legend}</div>
  </div>`;
}

const CRC_T = (()=>{ const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[i]=c>>>0; }
  return t; })();

function zipBlob(files, mime){

    const nb = enc.encode(f.name);

    const crc = crc32(data);
    const lh = new Uint8Array(30+nb.length), lv = new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
    lv.setUint16(8,0,true); lv.setUint16(10,0,true); lv.setUint16(12,0x2151,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,nb.length,true); lv.setUint16(28,0,true);
    lh.set(nb,30); parts.push(lh, data);
    const cd = new Uint8Array(46+nb.length), cv = new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0x2151,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,data.length,true); cv.setUint32(24,data.length,true);
    cv.setUint16(28,nb.length,true); cv.setUint32(42,off,true);
    cd.set(nb,46); central.push(cd);
    off += lh.length + data.length;
  });
  const cdSize = central.reduce((a,c)=>a+c.length,0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,off,true);
  return new Blob(parts.concat(central,[eo]), {type:mime});
}
function xe(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m])); }
function colName(i){ let s=''; i++; while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26); } return s; }
function sheetXml(rows, widths){

    const cells = row.map((c,ci)=>{
      if(c==null||c==='') return '';

      const ref = colName(ci)+(ri+1);
      const isNum = typeof o.v === 'number' && isFinite(o.v);

      return isNum

    }).join('');

  }).join('');
  const cols = widths ? '<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>' : '';

<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${body}</sheetData></worksheet>`;
}
function xlsxBlob(sheets){

function monthRows(m){
  const c = calc(m);
  const B = v => ({v, bold:true});
  const rows = [];
  rows.push([B('Route to Debt-Free'), '', '', '', B(monthLabel(m.id))]);
  rows.push(['Payday', m.payday||'', '', '', '']);
  rows.push(['Currency', cur(), '', '', '']);
  rows.push([]);
  rows.push([B('INCOME')]);
  rows.push([B('Source'), B('Amount'), B('Status')]);
  (m.income||[]).forEach(l=>rows.push([l.label, num(l.amount), l.received?'Received':'Pending']));
  rows.push([B('Total income'), B(c.inc)]);
  rows.push([]);
  rows.push([B('EXPENSES AND SAVINGS')]);
  rows.push([B('Category'), B('Remarks'), B('Group'), B('Term'), B('Planned'), B('Actual'), B('Status')]);
  (m.lines||[]).forEach(l=>{
    const act = (l.actual!==''&&l.actual!=null) ? num(l.actual) : (l.paid?num(l.amount):'');
    rows.push([l.category, l.remarks||'', l.group||'Other',
      num(l.termTotal)>0 ? num(l.termCurrent)+'/'+num(l.termTotal) : '',
      num(l.amount), act, l.paid?'Paid':'Due']);
  });
  rows.push([B('Total'), '', '', '', B(c.planSpend+c.planSave), B(c.actSpend+c.actSave)]);
  rows.push([B('Remaining'), '', '', '', B(c.free)]);
  rows.push([]);
  rows.push([B('Still owed on instalments'), '', '', '', c.debtLeft]);
  if(m.note) rows.push([B('Note'), m.note]);

}

function loadSyncCode(){
  try{
    SYNC.code = localStorage.getItem('rtdf.sync') || null;
    SYNC.okAt = num(localStorage.getItem('rtdf.syncOk')) || 0;
    SYNC.failSince = num(localStorage.getItem('rtdf.syncFail')) || 0;
  }catch(e){}
}
function storeSyncCode(c){
  SYNC.code = c || null;
  try{ c ? localStorage.setItem('rtdf.sync', c) : localStorage.removeItem('rtdf.sync'); }catch(e){}
  if(!c) noteSyncHealth('off');
}
/* remembers when sync last worked and when it started failing, so the warning survives closing the app */
function noteSyncHealth(st){
  const now = Date.now();
  if(st === 'ok'){ SYNC.okAt = now; SYNC.failSince = 0; }
  else if(st === 'error'){ if(!SYNC.failSince) SYNC.failSince = now; }
  else if(st === 'off'){ SYNC.failSince = 0; }
  else return;
  try{
    localStorage.setItem('rtdf.syncOk', String(SYNC.okAt||0));
    SYNC.failSince ? localStorage.setItem('rtdf.syncFail', String(SYNC.failSince)) : localStorage.removeItem('rtdf.syncFail');
  }catch(e){}
}
function syncPaused(){
  if(!syncOn() || SYNC.status !== 'error' || !SYNC.failSince) return false;
  const now = Date.now();
  // a short blip stays on the chip only; show the warning after a minute, or at once if the last good sync is over an hour old
  return now - SYNC.failSince > 60000 || !SYNC.okAt || now - SYNC.okAt > 3600000;
}
function whenText(t){
  const d = new Date(t), today = new Date();
  if(d.toDateString() === today.toDateString()) return 'today at ' + clockText(d);
  return d.getDate() + ' ' + MONTH_NAMES[d.getMonth()].slice(0,3) + ', ' + clockText(d);
}
function paintSyncBanner(){
  const el = $('#syncBanner'); if(!el) return;
  if(!syncPaused()){ if(el.innerHTML) el.innerHTML = ''; return; }
  const since = SYNC.okAt ? 'Last synced ' + whenText(SYNC.okAt) + '.' : 'This device has not synced yet.';
  el.innerHTML = `<div class="sync-warn" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M18.4 18H7a4 4 0 01-.9-7.9 6 6 0 012.2-3.6M12 5a6 6 0 015.6 3.9A4.5 4.5 0 0120.8 15"/></svg>
    <div style="min-width:0;flex:1">
      <b>Sync is paused</b>
      <p>${since} Your changes are saved on this device only for now. They will send by themselves when sync is back.</p>
      ${state.syncWhy ? `<p>Either this device is offline, or the sync service has paused. Nothing is lost. If it still says paused tomorrow, the sync service needs restarting in Supabase.</p>` : ''}
      <div class="acts">
        <button class="btn sm primary" data-act="sync-retry">Try again</button>
        <button class="btn sm" data-act="sync-why">${state.syncWhy ? 'Hide details' : 'What happened?'}</button>
      </div>
    </div>
  </div>`;
}
async function rpc(fn, body){
  const r = await fetch(SUPA.url + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPA.key,'Authorization':'Bearer '+SUPA.key},
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error('sync_http_'+r.status);
  return r.json();
}
function snapshot(){
  return {v:1, stamp: state.stamp || new Date().toISOString(), settings: state.settings, months: state.months};
}
function setSync(st){ SYNC.status = st; noteSyncHealth(st); paintSyncChip(); paintSyncBanner(); }
function clockText(d){
  try{ return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }catch(e){ return ''; }
}
function flashSaved(){
  if(syncOn()) return;                      // the sync chip covers it
  const el = $('#syncChip'); if(!el) return;
  el.style.display = 'inline-flex';
  el.innerHTML = '<i class="dot" style="background:var(--ok)"></i>Saved '+clockText(new Date());
  el.title = 'Saved on this device';
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>{ if(!syncOn()) el.style.display='none'; }, 4000);
}
function paintSyncChip(){
  const el = $('#syncChip'); if(!el) return;
  if(!syncOn()){
    if(state.savedAt && Date.now()-state.savedAt < 4000) flashSaved();
    else el.style.display = 'none';
    return;
  }
  const t = SYNC.last ? clockText(SYNC.last) : '';
  const map = {
    ok:      ['var(--ok)',     t ? 'Synced '+t : 'Synced',  'All devices are up to date'],
    syncing: ['var(--accent)', 'Syncing',                   'Sending your changes'],
    pending: ['var(--warn)',   'Saving',                    'Change saved here, sending now'],
    error:   ['var(--bad)',    'Offline',                   'Saved on this device only. It will send when you are back online.'],
    off:     ['var(--muted)',  'Sync',                      '']
  };
  const m = map[SYNC.status] || map.off;
  el.style.display = 'inline-flex';
  el.innerHTML = '<i class="dot" style="background:'+m[0]+'"></i>'+m[1];
  el.title = m[2];
}
function queuePush(){
  if(!syncOn()) return;
  clearTimeout(SYNC.timer);
  setSync('pending');
  SYNC.timer = setTimeout(syncPush, 1200);
}
async function syncPush(quiet){
  if(!syncOn()) return;
  if(SYNC.busy){ clearTimeout(SYNC.timer); SYNC.timer = setTimeout(syncPush, 1500); return; }
  SYNC.busy = true; setSync('syncing');
  try{
    await rpc('budget_vault_put', {p_code:SYNC.code, p_payload:snapshot()});
    SYNC.last = new Date(); setSync('ok');
    const now = Date.now();
    if(!quiet && now - (syncPush._said||0) > 7000){
      syncPush._said = now;
      toast('Saved and synced to your other devices');
    }
  }
  catch(e){ setSync('error'); if(!quiet) toast('Saved here. No connection, it will sync later.'); }
  SYNC.busy = false;
}
async function syncPull(){
  if(!syncOn() || SYNC.busy) return;
  const ae = document.activeElement;
  if(ae && ae.classList && ae.classList.contains('inp')) return;
  SYNC.busy = true;
  try{
    const rows = await rpc('budget_vault_get', {p_code:SYNC.code});
    const row = rows && rows[0];
    if(row && row.payload && row.payload.months && Object.keys(row.payload.months).length){
      const rs = row.payload.stamp || row.updated_at;
      if(!state.stamp || new Date(rs) > new Date(state.stamp)){
        const before = JSON.stringify(state.months);
        state.months = row.payload.months;
        if(row.payload.settings) state.settings = Object.assign(state.settings, row.payload.settings);
        state.stamp = rs;
        if(!state.monthId || !state.months[state.monthId]) state.monthId = pickMonth();
        localSave(false);
        if(JSON.stringify(state.months) !== before){
          renderSoon();
          toast('Updated from your other device');
        }
      }
    }
    SYNC.last = new Date(); setSync('ok');
  }catch(e){ setSync('error'); }
  SYNC.busy = false;
}
async function syncAdopt(code){
  storeSyncCode(code);
  setSync('syncing');
  let row = null;
  try{ const rows = await rpc('budget_vault_get', {p_code:code}); row = rows && rows[0]; }
  catch(e){ setSync('error'); toast('Could not reach the sync service'); storeSyncCode(null); render(); return; }
  const remoteHas = row && row.payload && row.payload.months && Object.keys(row.payload.months).length;
  if(remoteHas){
    if(!confirm('This code already has budget data saved. Replace what is on this device with it?')){
      storeSyncCode(null); setSync('off'); render(); return;
    }
    state.months = row.payload.months;
    if(row.payload.settings) state.settings = Object.assign(state.settings, row.payload.settings);
    state.stamp = row.payload.stamp || row.updated_at;
    state.monthId = pickMonth();
    localSave(false);
    toast('Synced data loaded');
  } else {
    await syncPush(true);
    toast('Sync turned on');
  }
  SYNC.last = new Date(); setSync('ok');
  startPolling();
  render();
}
function startPolling(){
  if(SYNC.poll) return;
  SYNC.poll = setInterval(()=>{ if(!document.hidden) syncPull(); }, 20000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncPull(); });
  window.addEventListener('online', ()=>{ syncPull(); queuePush(); });
}

function setGroupColor(hex){
  const f = $('#gHex'); if(f) f.value = hex;
  const all = document.querySelectorAll('.sw');
  for(let i=0;i<all.length;i++) all[i].classList.toggle('on', all[i].dataset.id === hex);
}
async function renameGroupEverywhere(from, to){
  for(const mid of sortedMonthIds()){
    const mm = state.months[mid];
    let touched = false;
    (mm.lines||[]).forEach(l=>{ if(l.group === from){ l.group = to; touched = true; } });
    if(touched) await saveMonth(mm);
  }
}
function countLinesInGroup(name){
  let n = 0;
  sortedMonthIds().forEach(mid=>{
    (state.months[mid].lines||[]).forEach(l=>{ if(l.group === name) n++; });
  });
  return n;
}

/* last 6 visible months up to the open one: what was actually paid (ticked) each month */
function trendCard(m){
  const ids = sortedMonthIds().filter(id=>id<=m.id && (id===m.id || !state.months[id].hidden)).slice(-6);
  if(ids.length < 2) return '';
  const rows = ids.map(id=>{ const c = calc(state.months[id]); return {id, spent:c.actSpend, saved:c.actSave}; });
  const max = Math.max(1, ...rows.map(r=>Math.max(r.spent, r.saved)));
  const saveHex = groupHex('Savings');
  const bars = rows.map(r=>`
    <div class="tr-col" title="${esc(monthLabel(r.id))}: spent ${money(r.spent)}, saved ${money(r.saved)}">
      <div class="tr-bars">
        <i style="height:${Math.round(r.spent/max*100)}%;background:var(--accent)"></i>
        <i style="height:${Math.round(r.saved/max*100)}%;background:${saveHex}"></i>
      </div>
      <span class="${r.id===m.id?'on':''}">${MONTH_NAMES[parseInt(r.id.slice(5),10)-1].slice(0,3)}</span>
    </div>`).join('');
  const cur = rows[rows.length-1], prev = rows[rows.length-2];
  const d = cur.spent - prev.spent;
  const curLabel = MONTH_NAMES[parseInt(cur.id.slice(5),10)-1];
  const prevLabel = MONTH_NAMES[parseInt(prev.id.slice(5),10)-1];
  const note = d===0 ? `Same spending as ${prevLabel} so far.`
    : `${curLabel} so far: ${money(Math.abs(d))} ${d<0?'less':'more'} spent than ${prevLabel}.`;
  return `<div class="card" style="margin-top:14px">
    <div class="sec-head"><h3>Month by month</h3><span class="muted">Paid bills only</span></div>
    <div class="pad">
      <div class="tr-chart">${bars}</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;font-weight:600" class="muted">
        <span><i class="dot" style="display:inline-block;background:var(--accent);margin-right:5px"></i>Spent</span>
        <span><i class="dot" style="display:inline-block;background:${saveHex};margin-right:5px"></i>Saved</span>
        <span style="margin-left:auto;color:${d>0?'var(--bad)':(d<0?'var(--ok)':'var(--muted)')}">${note}</span>
      </div>
    </div>
  </div>`;
}

function viewDebt(){

  if(!c.insts.length){

  }
  const monthly = c.insts.reduce((a,l)=>a+num(l.amount),0);
  const cards = c.insts.slice().sort((a,b)=>(num(b.termTotal)-num(b.termCurrent))-(num(a.termTotal)-num(a.termCurrent))).map(l=>{
    const tot = num(l.termTotal), cu = num(l.termCurrent), left = Math.max(0,tot-cu);
    const pct = tot?Math.round(cu/tot*100):0;
    const end = shiftMonth(m.id, left);
    return `<div class="inst">
      <div class="inst-top">
        <div><b>${esc(l.category)}</b>${l.remarks?`<div class="rm">${esc(l.remarks)}</div>`:''}</div>

      <div class="split"><span>${cu} of ${tot} paid</span>
        <span>${left===0?'Cleared':money(num(l.amount)*left)+' left &middot; ends '+monthLabel(end)}</span></div>
    </div>`;
  }).join('');

  const timeline = proj ? proj.ends.map(e=>`
    <div style="display:flex;justify-content:space-between;padding:11px 18px;border-bottom:1px solid var(--line)">
      <span style="font-weight:600">${esc(e.name)}</span>

  return `<div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi hero"><div class="k-label">Total still owed</div><div class="k-val">${money(c.debtLeft)}</div>

      <div class="kpi"><div class="k-label">Monthly outflow</div><div class="k-val">${money(monthly)}</div>
        <div class="k-sub">${Math.round(monthly/(c.inc||1)*100)}% of income</div></div>
      <div class="kpi"><div class="k-label">Free and clear by</div><div class="k-val" style="font-size:19px">${proj?monthLabel(proj.freeMonth):'-'}</div>
        <div class="k-sub">${proj?proj.months+' months to go':''}</div></div>
    </div>
    <div class="two">
      <div class="card"><div class="sec-head"><h3>Instalment progress</h3></div>${cards}</div>
      <div class="card"><div class="sec-head"><h3>Clearing order</h3><span class="muted">Soonest first</span></div>${timeline}</div>
    </div>`;

/* ============ smooth updates ============ */
function setLive(key, html){
  const els = document.querySelectorAll('[data-live="'+key+'"]');
  for(let i=0;i<els.length;i++){
    if(els[i].innerHTML !== html){
      els[i].innerHTML = html;
      els[i].classList.remove('bump');
      void els[i].offsetWidth;
      els[i].classList.add('bump');
    }
  }
}
function paintTick(id, l){
  const btns = document.querySelectorAll('.tick[data-id="'+id+'"]');
  for(let i=0;i<btns.length;i++){
    const b = btns[i];
    b.classList.toggle('on', !!l.paid);
    const short = b.textContent.indexOf('Tick when') === -1;
    const label = l.paid ? 'Paid' : (short ? 'Mark paid' : 'Tick when paid');
    const icon = b.querySelector('i');
    b.innerHTML = '<i>' + ICONS.check + '</i>' + label;
    b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  }
}
function liveRefresh(){
  const m = activeMonth(); if(!m) return;
  const c = calc(m);
  const pct = c.total ? Math.round(c.paidCount/c.total*100) : 0;
  setLive('incsub', state.hideIncome ? 'Hidden from view' : money(c.incGot) + ' received');
  setLive('actspend', money(c.actSpend));
  setLive('tot-actual', money(c.actSpend + c.actSave));
  setLive('progress-text', c.paidCount + ' of ' + c.total + ' &middot; ' + money(c.unpaid) + ' still due');
  setLive('duecount', (c.total - c.paidCount) + ' still due');
  const bar = document.querySelector('[data-live="progress-bar"]');
  if(bar) bar.style.width = pct + '%';
  const trend = document.querySelector('.tr-chart');
  if(trend){ const html = trendCard(m); if(html) trend.closest('.card').outerHTML = html; }
  (m.lines||[]).forEach(l=>{
    const cell = document.querySelector('[data-live="actual-'+l.id+'"]');
    if(!cell) return;
    const actual = (l.actual!=='' && l.actual!=null) ? num(l.actual) : (l.paid ? num(l.amount) : null);
    const diff = actual!=null ? actual - num(l.amount) : null;
    cell.style.color = diff==null ? '' : (diff>0 ? 'var(--bad)' : (diff<0 ? 'var(--ok)' : ''));
    const html = actual!=null ? money(actual) : '<span class="muted">-</span>';
    if(cell.innerHTML !== html) cell.innerHTML = html;
  });
}
let renderQueued = false;
function renderSoon(){
  if(renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(()=>{ renderQueued = false; render(); });
}

  const sel = $('#monthSel');

  const eb = $('#exportBtn'); if(eb && !eb.dataset.init){ eb.innerHTML = ICONS.down + '<span>Export</span>'; eb.dataset.init='1'; }

  paintSyncChip();
  paintSyncBanner();
  const v = $('#view');
  if(state.booting && !activeMonth()) v.innerHTML = skeleton();
  else if(state.tab==='overview') v.innerHTML = viewOverview();
  else if(state.tab==='budget') v.innerHTML = viewBudget();
  else if(state.tab==='debt') v.innerHTML = viewDebt();
  else v.innerHTML = viewSettings();

  if(keepY > 0 && Math.abs((window.scrollY||0) - keepY) > 1){

  }
}

/* ============ actions ============ */
function findLine(id){ const m=activeMonth(); return (m.lines||[]).find(l=>l.id===id); }

async function handle(act, id, ev){
  const m = activeMonth();
  switch(act){
    case 'add': lineModal(null); break;
    case 'edit': lineModal(findLine(id)); break;
    case 'tog': {
      const l = findLine(id); if(!l) break;
      l.paid = !l.paid;
      if(l.paid && (l.actual===''||l.actual==null)) l.actual = num(l.amount);
      if(!l.paid) l.actual = '';
      paintTick(id, l);
      liveRefresh();
      saveMonth(m);
      break;
    }
    case 'del': {
      if(!confirm('Delete this line?')) break;
      m.lines = (m.lines||[]).filter(l=>l.id!==id);
      await saveMonth(m); render(); break;
    }
    case 'del-from-modal': {
      const mid = $('#mId').value;
      if(!confirm('Delete this line?')) break;
      m.lines = (m.lines||[]).filter(l=>l.id!==mid);
      await saveMonth(m); closeModal(); toast('Line deleted'); break;
    }
    case 'save-line': {
      const mid = $('#mId').value;
      const cat = $('#mCat').value.trim();
      if(!cat){ toast('Give it a category name'); break; }
      const data = {
        id: mid,
        category: cat,
        remarks: $('#mRem').value.trim(),
        amount: num($('#mAmt').value),
        group: $('#mGrp').value,
        termCurrent: $('#mTc').value===''?'':num($('#mTc').value),
        termTotal: $('#mTt').value===''?'':num($('#mTt').value),
        actual: $('#mAct').value===''?'':num($('#mAct').value)
      };
      const ex = (m.lines||[]).find(l=>l.id===mid);
      if(ex) Object.assign(ex, data, {paid: ex.paid});
      else { data.paid=false; m.lines = (m.lines||[]).concat([data]); }
      await saveMonth(m); closeModal(); toast('Saved'); break;
    }
    case 'add-inc': incomeModal(null); break;
    case 'edit-inc': incomeModal((m.income||[]).find(l=>l.id===id)); break;
    case 'del-inc': {
      m.income = (m.income||[]).filter(l=>l.id!==id);
      await saveMonth(m); render(); break;
    }
    case 'tog-inc': {
      const l = (m.income||[]).find(x=>x.id===id); if(!l) break;
      l.received = !l.received;
      const b = document.querySelector('.state[data-id="'+id+'"]');
      if(b){ b.className = 'state ' + (l.received?'yes':'no'); b.textContent = l.received?'Received':'Pending'; }
      liveRefresh();
      saveMonth(m);
      break;
    }
    case 'save-inc': {
      const iid = $('#iId').value, lab = $('#iLab').value.trim();
      if(!lab){ toast('Name the source'); break; }
      const ex = (m.income||[]).find(l=>l.id===iid);
      if(ex){ ex.label=lab; ex.amount=num($('#iAmt').value); }
      else m.income = (m.income||[]).concat([{id:iid,label:lab,amount:num($('#iAmt').value),received:false}]);
      await saveMonth(m); closeModal(); toast('Saved'); break;
    }
    case 'create-month': {
      const val = $('#nMonth').value; if(!val){ toast('Pick a month'); break; }
      if(state.months[val]){ toast('That month already exists'); break; }
      const baseSel = $('#nBase') ? $('#nBase').value : '';
      const src = baseSel ? state.months[baseSel] : null;
      const nm = {
        id: val, payday: val+'-25', note:'',
        income: src ? (src.income||[]).map(l=>({id:uid(),label:l.label,amount:num(l.amount),received:false}))
                    : [{id:uid(),label:'Salary',amount:0,received:false}],
        lines: []
      };
      if(src){
        (src.lines||[]).forEach(l=>{
          const tt = num(l.termTotal), tc = num(l.termCurrent);
          if(tt>0){
            if(tc>=tt) return;                       // finished, drop it
            nm.lines.push(Object.assign({},l,{id:uid(),termCurrent:tc+1,paid:false,actual:''}));
          } else {
            nm.lines.push(Object.assign({},l,{id:uid(),paid:false,actual:''}));
          }
        });
      }
      await saveMonth(nm);
      state.monthId = val; closeModal(); toast(monthLabel(val)+' created'); break;
    }
    case 'open-month': state.monthId=id; state.tab='overview'; render(); break;
    case 'del-month': {
      if(!confirm('Delete '+monthLabel(id)+'? This cannot be undone.')) break;
      await removeMonth(id);
      if(state.monthId===id) state.monthId = pickMonth();
      render(); break;
    }
    case 'hide-month': {
      const hm = state.months[id]; if(!hm) break;
      if(!hm.hidden && visibleMonthIds().length<=1){ toast('Keep at least one month showing'); break; }
      hm.hidden = !hm.hidden;
      await saveMonth(hm);
      if(hm.hidden && state.monthId===id) state.monthId = pickMonth();
      toast(monthLabel(id)+(hm.hidden?' hidden':' showing again'));
      render(); break;
    }
    case 'save-settings': {
      state.settings.name = $('#setName').value.trim()||'Ace';
      state.settings.currency = $('#setCur').value.trim()||'AED';
      await saveSettings();
      if(m && $('#setIncome')){
        const want = num($('#setIncome').value);
        if(!(m.income||[]).length) m.income = [{id:uid(), label:'Salary', amount:want, received:false}];
        else {
          const others = m.income.slice(1).reduce((a,l)=>a+num(l.amount),0);
          m.income[0].amount = Math.max(0, want-others);
        }
      }
      if(m && $('#setPayday')){ m.payday = $('#setPayday').value; m.note = $('#setNote').value.trim(); }
      if(m) await saveMonth(m);
      render(); toast('Settings saved'); break;
    }
    case 'toggle-eye': state.hideIncome = !state.hideIncome; localSave(); render(); break;
    case 'export-month': exportMonth(m); break;
    case 'backup-out': exportBackup(); break;
    case 'add-group': groupModal(null); break;
    case 'edit-group': groupModal(Number(id)); break;
    case 'pick-color': setGroupColor(id); break;
    case 'save-group': {
      const idxRaw = $('#gIdx').value;
      const name = $('#gName').value.trim();
      const hex = ($('#gHex').value || '#9aa0b4').trim();
      if(!name){ toast('Give the group a name'); break; }
      if(name.length > 24){ toast('Keep the name under 25 characters'); break; }
      const list = groups().map(x => Object.assign({}, x));
      const clash = list.findIndex(x => x.name.toLowerCase() === name.toLowerCase());
      if(idxRaw === ''){
        if(clash >= 0){ toast('You already have that group'); break; }
        list.push({name, hex});
      } else {
        const i = Number(idxRaw);
        if(!list[i] || list[i].locked){ closeModal(); break; }
        if(clash >= 0 && clash !== i){ toast('You already have that group'); break; }
        const was = list[i].name;
        list[i] = Object.assign({}, list[i], {name, hex});
        if(was !== name) await renameGroupEverywhere(was, name);
      }
      state.settings.groups = list;
      await saveSettings();
      localSave();
      closeModal(); toast('Group saved'); break;
    }
    case 'del-group': {
      const i = Number(id);
      const list = groups().map(x => Object.assign({}, x));
      const g = list[i];
      if(!g || g.locked) break;
      const used = countLinesInGroup(g.name);
      const msg = used
        ? 'Delete "' + g.name + '"? ' + used + ' line' + (used === 1 ? '' : 's') + ' will move to Other.'
        : 'Delete "' + g.name + '"?';
      if(!confirm(msg)) break;
      if(used) await renameGroupEverywhere(g.name, 'Other');
      list.splice(i, 1);
      state.settings.groups = list;
      await saveSettings();
      localSave();
      render(); toast('Group deleted'); break;
    }
    case 'sync-on': await syncAdopt(newCode()); break;
    case 'sync-join': {
      const c = normCode(($('#syncCodeIn')||{}).value);
      if(c.length < 24){ toast('That code looks too short'); break; }
      await syncAdopt(c); break;
    }
    case 'sync-off': {
      if(!confirm('Turn off sync on this device? Your data stays here, it just stops updating the other device.')) break;
      storeSyncCode(null); clearTimeout(SYNC.timer); setSync('off'); render(); break;
    }
    case 'sync-now': await syncPull(); await syncPush(); render(); toast('Up to date'); break;
    case 'sync-eye': state.showCode = !state.showCode; render(); break;
    case 'sync-retry': {
      toast('Trying to reach sync');
      await syncPull();
      if(SYNC.status === 'ok'){ await syncPush(true); toast('Sync is back. Your changes were sent.'); }
      else toast('Still paused. Your changes stay safe on this device.');
      break;
    }
    case 'sync-why': state.syncWhy = !state.syncWhy; paintSyncBanner(); break;
    case 'sync-copy': {
      try{ await navigator.clipboard.writeText(SYNC.code); toast('Code copied'); }
      catch(err){ state.showCode = true; render(); toast('Copy it by hand from the box above'); }
      break;
    }
    case 'backup-in': { const f = $('#importFile'); if(f){ f.value=''; f.click(); } break; }
    case 'export-all': exportAll(); break;
    case 'close': closeModal(); break;
  }
}

/* ============ wiring ============ */
document.addEventListener('click', e=>{
  const veil = e.target.closest('[data-veil]');
  if(veil && e.target===veil){ closeModal(); return; }
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ state.tab = tabBtn.dataset.tab; render(); window.scrollTo({top:0}); return; }
  const a = e.target.closest('[data-act]');
  if(a){ e.preventDefault(); handle(a.dataset.act, a.dataset.id, e); return; }
  const nb = e.target.closest('#newMonthBtn,#newMonthBtn2,#newMonthBtn3');
  if(nb){ newMonthModal(); return; }
  const tt = e.target.closest('#themeToggle,#themeBtn');
  if(tt){ toggleTheme(); return; }
  const ex = e.target.closest('#exportBtn');
  if(ex){ exportMonth(activeMonth()); return; }
});
document.addEventListener('change', e=>{
  if(e.target.id==='monthSel'){ state.monthId = e.target.value; render(); }
  if(e.target.id==='importFile' && e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && state.modal) closeModal(); });
function currentTheme(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t==='dark'||t==='light') return t;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function toggleTheme(){
  const next = currentTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('rtdf.theme', next); }catch(err){}
  paintChrome();
}
try{ const t = localStorage.getItem('rtdf.theme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme', t); }catch(e){}

/* ============ boot ============ */
const SEED = null;
async function seedIfEmpty(){
  if(Object.keys(state.months).length) return;
  const blank = {id:todayId(), payday:todayId()+'-25', note:'',
    income:[{id:uid(), label:'Salary', amount:0, received:false}], lines:[]};
  const m = (typeof SEED !== 'undefined' && SEED) ? JSON.parse(JSON.stringify(SEED)) : blank;
  state.monthId = m.id;
  await saveMonth(m);
}
function pickMonth(){
  const ids = visibleMonthIds().length ? visibleMonthIds() : sortedMonthIds();
  if(!ids.length) return null;
  const t = todayId();
  return ids.includes(t) ? t : ids[ids.length-1];
}

(async function boot(){
  localLoad();
  loadSyncCode();
  state.monthId = pickMonth();
  render();

  let db = null;
  try{ db = await (window.claude && window.claude.use ? window.claude.use('db') : null); }catch(e){ db = null; }
  DB = db;

  if(DB){
    try{
      const s = await DB.doc('settings/app').get();
      if(s.exists) state.settings = Object.assign(state.settings, s.data());
      const snap = await DB.collection('months').get();
      if(snap.size){
        state.months = {};
        snap.docs.forEach(d=>{ const v = d.data(); state.months[d.id] = Object.assign({id:d.id}, v); });
        localSave();
      } else if(Object.keys(state.months).length){
        for(const id of sortedMonthIds()) await saveMonth(state.months[id]);
      }
    }catch(e){}
    try{
      DB.collection('months').onSnapshot(snap=>{
        const next = {};
        snap.docs.forEach(d=>{ next[d.id] = Object.assign({id:d.id}, d.data()); });
        if(Object.keys(next).length){ state.months = next; localSave(); }
        if(!state.monthId || !state.months[state.monthId]) state.monthId = pickMonth();
        render();
      }, ()=>{});
    }catch(e){}
  }

  await seedIfEmpty();
  if(!state.monthId) state.monthId = pickMonth();
  if(!Array.isArray(state.settings.groups) || !state.settings.groups.length){
    state.settings.groups = DEFAULT_GROUPS.map(g => Object.assign({}, g));
  }
  state.booting = false;
  state.ready = true;
  render();

  if(syncOn()){ startPolling(); await syncPull(); paintSyncChip(); }
})();

</script>
